pipeline: obsidian-plugin
orb_version: dev:snapshot
node_version: "20"
sast: true
sbom: true
test:
  # `npm run check` = typecheck + vitest with coverage thresholds enforced.
  # Vitest exits non-zero on threshold violation, failing the build.
  commands: ["npm run build", "npm run check"]
  coverage:
    tool: vitest
    command: npm run test:coverage
contexts:
  github: github
